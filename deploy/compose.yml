# VPS fallback only. For managed Hostinger Node.js Apps, follow docs/HOSTINGER-DEPLOYMENT.md.
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: godown
      POSTGRES_USER: godown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes:
      - godown_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U godown -d godown]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: postgresql://godown:${POSTGRES_PASSWORD}@db:5432/godown
      DIRECT_URL: postgresql://godown:${POSTGRES_PASSWORD}@db:5432/godown
      NEXTAUTH_URL: https://${DOMAIN:?Set the client domain}
      TZ: Asia/Karachi
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - godown_tls:/data
      - godown_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  godown_database:
  godown_tls:
  godown_caddy_config:
